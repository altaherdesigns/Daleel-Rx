<style>
  :root{
    --bg:#ffffff; --ink:#10151f; --navy:#0b3b6f; --muted:#5b6472;
    --serif:"Source Serif 4", Georgia, serif;
    --sans:"IBM Plex Sans", -apple-system, Segoe UI, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; display:flex; align-items:center;
    justify-content:center; min-height:100vh; padding:2.5rem 1.5rem;
  }
  .content{ max-width:440px; text-align:center; }
  .mark{ display:flex; align-items:center; justify-content:center; gap:0.55rem; margin-bottom:2rem; }
  .wordmark{ font-family:var(--serif); font-weight:600; font-size:1.1rem; color:var(--navy); }
  h1{ font-family:var(--serif); font-weight:500; font-size:1.7rem; line-height:1.35; color:var(--navy); margin:0 0 0.8rem; }
  p{ font-size:1rem; line-height:1.6; color:var(--muted); margin:0 0 1.6rem; }
  a{ color:var(--navy); font-size:0.95rem; }
</style>
</head>
<body>
  <div class="content">
    <div class="mark">
      <svg viewBox="0 0 32 32" width="26" height="26">
        <circle cx="16" cy="16" r="14.5" fill="none" stroke="#0b3b6f" stroke-width="1.4"/>
        <circle cx="16" cy="16" r="1.6" fill="#0b3b6f"/>

        <path d="M16 5 L19 16 L16 16 Z" fill="#0b3b6f"/>

    <h1>You're on the list.</h1>
    <p>We'll email you the moment Daleel Rx is ready to use. Nothing else in the meantime.</p>
    <a href="/">Back to the homepage</a>
  </div>
