name: Publish blog post

on:
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC (~10:00 Gulf time)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Generate post
        id: publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python scripts/publish_post.py

      - name: Commit and push
        if: steps.publish.outputs.published == 'true'
        run: |
          git config user.name "daleelrx-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Auto-publish: ${{ steps.publish.outputs.title }}"
          git push

      - name: Log a skipped run as an issue
        if: steps.publish.outputs.published == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Blog automation skipped publishing — ${new Date().toISOString().slice(0,10)}`,
              body: `${{ steps.publish.outputs.reason }}`
            })
