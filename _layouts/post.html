---
layout: default
---
<article class="post">
  <p class="post-meta">
    {{ page.date | date: "%-d %B %Y" }}
    {% if page.reviewed_by %} · Reviewed by {{ page.reviewed_by }}{% endif %}
  </p>
  <h1>{{ page.title }}</h1>
  {{ content }}
  {% if page.sources %}
  <div class="sources">
    <h2>Sources</h2>
    <ul>
    {% for s in page.sources %}
      <li><a href="{{ s.url }}">{{ s.name }}</a></li>
    {% endfor %}
    </ul>
  </div>
  {% endif %}
</article>
